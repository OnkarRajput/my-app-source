name: Enterprise DevSecOps Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.2.2 # ◄ UPDATED: Node 24 compatible version

      # 1. SCA (Software Composition Analysis) - Scan base layers & dependencies
      - name: Run SCA (Trivy Scan)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # 2. SAST (Static Application Security Testing) - Scan static source code
      - name: Run SAST (Semgrep Scan)
        uses: semgrep/semgrep-action@v1
        with:
          auditOnInvalidYaml: true

      # 3. Docker Build & Push Container Image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Set up QEMU for ARM emulation on the GitHub runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3.5.0

      # Set up Docker Buildx (required for explicit platform targeting)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.9.0

      # Build and push the ARM64 container image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6.13.0
        with:
          context: .
          push: true
          # ◄ FORCES THE BUILD TO MATCH YOUR MAC MINI M4 CHIP
          platforms: linux/arm64 
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/devsecops-app:${{ github.sha }},${{ secrets.DOCKERHUB_USERNAME }}/devsecops-app:latest


      # 4. GitOps Manifest Sync (Checkout Manifest Repo using GITOPS_REPO_PAT)
      - name: Checkout GitOps Manifest Repository
        uses: actions/checkout@v4.2.2 # ◄ UPDATED: Node 24 compatible version
        with:
          repository: '${{ github.repository_owner }}/my-gitops-manifests'
          token: '${{ secrets.GITOPS_REPO_PAT }}'
          path: 'manifest-repo'

      # 5. Kustomize Automated Tag Overwrite
      - name: Update Image Tag via Kustomize
        run: |
          cd manifest-repo/environments/dev
          
          # Swaps image tags cleanly without dangerous regex patterns or brittle sed strings
          kustomize edit set image docker.io/placeholder/devsecops-app=${{ secrets.DOCKERHUB_USERNAME }}/devsecops-app:${{ github.sha }}
          
          # Configure a generic bot profile to commit the modification
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@://github.com"
          
          git add kustomization.yaml
          git commit -m "chore: release tag version ${{ github.sha }} [skip ci]"
          git push

  dast-scan:
    needs: security-and-build
    runs-on: self-hosted # Executes locally on your Mac runner to access your Minikube cluster
    steps:
      - name: Wait for ArgoCD Rollout
        run: sleep 180 # 3-minute pause allowing ArgoCD time to poll GitHub and sync to Minikube

      # 6. DAST (Dynamic Application Security Testing) - Run in-cluster to avoid vfkit socket limits
      - name: Trigger In-Cluster DAST Scan
        run: |
          # Clean up any leftover old job execution from a previous run first
          kubectl delete job dast-zap-scan --ignore-not-found -n default
          
          # Apply the DAST scanner task inside your Minikube cluster directly
          kubectl apply -f - <<EOF
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: dast-zap-scan
            namespace: default
          spec:
            ttlSecondsAfterFinished: 100
            template:
              spec:
                containers:
                - name: zap-scanner
                  image: ghcr.io/zaproxy/zaproxy:stable
                  # Targets the internal Kubernetes DNS endpoint of your enterprise app service
                  command: ["zap-baseline.py", "-t", "http://cluster.local"]
                restartPolicy: Never
          EOF

      # 7. Print Vulnerability Report directly into GitHub Actions console logs
      - name: Fetch and Display DAST Scan Results
        run: |
          echo "Waiting for security scan to complete..."
          sleep 30
          # Stream the live security reports straight out of the cluster pod
          kubectl logs job/dast-zap-scan -n default
